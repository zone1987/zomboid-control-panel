; Buffering would hold SSE frames back until 4096 bytes accumulate.
output_buffering = Off
zlib.output_compression = Off
implicit_flush = On

expose_php = Off
memory_limit = 256M
max_execution_time = 60
; Large packs arrive in pieces, so no single request needs to be large
; -- but a browser that sends one whole file anyway should not be met
; with a 500 from PHP's own startup, which happens before any code runs
; and answers HTML rather than JSON. 64M is headroom for that case;
; UI2.pack is 52 MB.
upload_max_filesize = 64M
post_max_size = 68M
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload_user = www-data

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
