[global]
daemonize = no
; php-fpm closes STDOUT at startup, so /proc/self/fd/1 does not work.
error_log = /proc/self/fd/2
log_limit = 8192

[api]
access.log = /proc/self/fd/2
user = www-data
group = www-data
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = ${PHP_FPM_API_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

[sse]
access.log = /proc/self/fd/2
user = www-data
group = www-data
listen = /run/php-fpm-sse.sock
listen.owner = www-data
listen.group = www-data
pm = static
pm.max_children = ${PHP_FPM_SSE_MAX_CHILDREN}
pm.max_requests = 0
; Streams are capped in application code; this is the backstop.
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
