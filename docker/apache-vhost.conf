<VirtualHost *:80>
    ServerName ${SERVER_NAME}
    DocumentRoot /app/public

    # Long-lived SSE connections occupy one FPM worker each for their whole
    # lifetime. They get their own pool so a burst of open streams cannot
    # starve ordinary API requests.
    <LocationMatch "^/api/.*/stream$">
        SetEnvIf Request_URI ".*" no-gzip=1
        SetHandler "proxy:unix:/run/php-fpm-sse.sock|fcgi://sse"
    </LocationMatch>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm.sock|fcgi://api"
    </FilesMatch>

    <Directory /app/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # The SPA build is served directly; anything unknown falls back to
    # index.html so client-side routing works on reload.
    <Directory /app/public/app>
        AllowOverride None
        Require all granted
        FallbackResource /app/index.html
    </Directory>

    <Directory /app/public/bundles>
        FallbackResource disabled
    </Directory>

    DirectoryIndex index.php

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
