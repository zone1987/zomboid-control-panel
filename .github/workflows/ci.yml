name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Doctrine appends `_test` in the test environment, so the
          # database the suite opens is `db_test` -- created here under
          # that final name, not under the one in DATABASE_URL.
          POSTGRES_DB: db_test
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://db:db@127.0.0.1:5432/db?serverVersion=17&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, sodium, ftp, curl, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run migrations
        working-directory: backend
        env:
          APP_ENV: test
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        working-directory: backend
        run: php bin/phpunit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Built and proven to start before it is pushed: a broken image that
      # only fails at deploy time is the expensive kind.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: zomboidcontrol:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image against a database
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_DB=zomboid -e POSTGRES_USER=zomboid \
            -e POSTGRES_PASSWORD=ci-password \
            postgres:17-alpine
          docker run -d --name ci-app --network ci-net -p 8099:80 \
            -e APP_SECRET=0123456789abcdef0123456789abcdef \
            -e CREDENTIALS_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e "DATABASE_URL=postgresql://zomboid:ci-password@ci-db:5432/zomboid?serverVersion=17&charset=utf8" \
            -e MESSENGER_TRANSPORT_DSN='doctrine://default?auto_setup=0' \
            -e APP_PUBLIC_URL=http://localhost:8099 \
            -e WEBAUTHN_RELYING_PARTY_ID=localhost \
            zomboidcontrol:candidate

      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-app 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 3
          done
          echo "::error::The image did not become healthy."
          docker logs ci-app
          exit 1

      - name: Check that the API and the interface answer
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/app/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/app/servers)" = 200
          curl -s http://localhost:8099/api/health | grep -q '"database":"ok"'
          # Every supervised process must be RUNNING; a crash loop would
          # otherwise pass unnoticed behind a healthy HTTP response.
          docker exec ci-app supervisorctl status > procs.txt
          cat procs.txt
          total=$(grep -c . procs.txt)
          running=$(grep -c RUNNING procs.txt)
          test "$total" -eq "$running"
          test "$total" -ge 4

      # The path above sets every secret explicitly, which is the least
      # likely way anybody deploys. This is the documented one: a domain
      # and nothing else, with the passwords generated inside.
      - name: Start again with nothing configured
        run: |
          docker rm -f ci-app ci-db >/dev/null 2>&1 || true
          docker volume rm -f ci-secrets >/dev/null 2>&1 || true
          docker volume create ci-secrets >/dev/null

          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_DB=zomboid -e POSTGRES_USER=zomboid \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/database-password \
            -v ci-secrets:/run/secrets \
            --entrypoint sh postgres:17-alpine -c '
              set -e
              mkdir -p /run/secrets
              if [ ! -s /run/secrets/database-password ]; then
                tr -dc "A-Za-z0-9" < /dev/urandom | head -c 48 > /run/secrets/database-password
              fi
              chmod 600 /run/secrets/database-password
              exec docker-entrypoint.sh postgres'

          docker run -d --name ci-app --network ci-net -p 8099:80 \
            -e APP_PUBLIC_URL=http://localhost:8099 \
            -e POSTGRES_HOST=ci-db \
            -v ci-secrets:/app/var/secrets \
            zomboidcontrol:candidate

      - name: The unconfigured start must work too
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-app 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 3
          done

          if [ "$status" != "healthy" ]; then
            echo "::error::The image did not become healthy with nothing configured."
            docker logs ci-app
            exit 1
          fi

          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/api/health)" = 200
          curl -s http://localhost:8099/api/health | grep -q '"database":"ok"'

          # Generated rather than demanded, and each the right length.
          test "$(docker exec ci-app sh -c 'wc -c < /app/var/secrets/app-secret')" -eq 32
          test "$(docker exec ci-app sh -c 'wc -c < /app/var/secrets/credentials-key')" -eq 64

          before=$(docker exec ci-app cat /app/var/secrets/credentials-key)
          docker restart ci-app >/dev/null

          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-app 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && break
            sleep 3
          done

          test "$status" = "healthy"
          after=$(docker exec ci-app cat /app/var/secrets/credentials-key)
          test "$before" = "$after"
          echo "Secrets survived a restart."

      - name: Report container logs when something failed
        if: failure()
        run: docker logs ci-app

      # arm64 as well as amd64: Apple Silicon and the cheap ARM instances
      # most hosters now sell cannot run an amd64-only image. The proving
      # steps above stay single-arch, because a multi-arch build cannot
      # be loaded into the local daemon to be started.
      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@v3

      - name: Push the image that was proven to start
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of truth for the version, and the two
      # places the panel declares it must agree with it. A release naming
      # 1.0.0 while the running panel reports 0.9.0 would make the update
      # banner permanently wrong, and nobody would notice from the outside.
      - name: Check the tag matches the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oP "app\.version: '\K[^']+" backend/config/services.yaml)
          bridge=$(grep -oP 'BRIDGE_VERSION = "\K[^"]+' backend/resources/bridge/ZomboidControlBridge.lua)

          echo "tag=$tag  app.version=$declared  bridge=$bridge"

          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag $tag does not match app.version $declared in backend/config/services.yaml."
            exit 1
          fi

          echo "BRIDGE_VERSION=$bridge" >> "$GITHUB_ENV"
          echo "APP_VERSION=$tag" >> "$GITHUB_ENV"

      # Shipped as its own download so an operator whose FTP the panel
      # cannot reach still has a way to install the bridge by hand.
      - name: Collect the release assets
        run: |
          mkdir -p dist
          cp backend/resources/bridge/ZomboidControlBridge.lua dist/
          ( cd dist && sha256sum ZomboidControlBridge.lua > ZomboidControlBridge.lua.sha256 )

      - uses: softprops/action-gh-release@v2
        with:
          name: ZomboidControl ${{ env.APP_VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/ZomboidControlBridge.lua
            dist/ZomboidControlBridge.lua.sha256
          body: |
            ## Install

            ```bash
            docker compose pull && docker compose up -d
            ```

            Or pin this version with `APP_VERSION=${{ env.APP_VERSION }}` in
            your `.env`. Full instructions, including Coolify, are in the
            [README](https://github.com/${{ github.repository }}#readme).

            **Image:** `ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}`

            ## The Lua bridge (${{ env.BRIDGE_VERSION }})

            The panel uploads the bridge itself under *Servers → Bridge →
            Install*, which is the way to do it. `ZomboidControlBridge.lua`
            is attached below for the case where the panel cannot reach your
            FTP: drop it into your server's `media/lua/server/` directory and
            restart the game server.

            A bridge on disk is not yet a running bridge — the game loads it
            at start, and the panel's bridge page reports the version that is
            actually answering, not the file.
