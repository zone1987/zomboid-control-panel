name: Release

# A release is cut from main and from nothing else. The backend suite is
# not repeated here -- it ran on the pull request that produced this
# commit -- but the gate below proves that is true rather than assuming
# it: the tag must sit on main, and main's own run for that exact commit
# must have succeeded.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Tag sits on green main
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag on a feature branch would otherwise publish an image and a
      # release from code that never entered main.
      - name: The tagged commit must be on main
        run: |
          sha="${{ github.sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $sha, which is not on main."
            exit 1
          fi

          echo "$sha is on main."

      # And main's run for that commit must have passed. Without this the
      # release would only prove the tag's location, not that the code at
      # it works.
      - name: Main's run for that commit must have succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"

          for attempt in $(seq 1 30); do
            conclusion=$(gh run list \
              --workflow Main --branch main --commit "$sha" \
              --limit 1 --json conclusion --jq '.[0].conclusion // "none"')

            case "$conclusion" in
              success)
                echo "Main succeeded for $sha."
                exit 0
                ;;
              failure|cancelled|timed_out)
                echo "::error::Main concluded '$conclusion' for $sha. Fix main before tagging."
                exit 1
                ;;
              *)
                echo "Main has not finished for $sha yet ($conclusion); waiting. [$attempt/30]"
                sleep 20
                ;;
            esac
          done

          echo "::error::Main did not finish for $sha within ten minutes."
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The image bakes the built interface in, so this is the one build
      # whose output ships to operators.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: [frontend]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: zomboidcontrol:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image against a database
        run: .github/scripts/start-image.sh configured

      - name: Start again with nothing configured
        run: .github/scripts/start-image.sh unconfigured

      - name: Report container logs when something failed
        if: failure()
        run: docker logs ci-app

      # amd64 only, deliberately -- see the note in main.yml.
      - name: Push the image that was proven to start
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [image]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of truth for the version, and the two
      # places the panel declares it must agree with it. A release naming
      # 1.0.0 while the running panel reports 0.9.0 would make the update
      # banner permanently wrong, and nobody would notice from the outside.
      - name: Check the tag matches the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oP "app\.version: '\K[^']+" backend/config/services.yaml)
          bridge=$(grep -oP 'BRIDGE_VERSION = "\K[^"]+' backend/resources/bridge/ZomboidControlBridge.lua)

          echo "tag=$tag  app.version=$declared  bridge=$bridge"

          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag $tag does not match app.version $declared in backend/config/services.yaml."
            exit 1
          fi

          echo "BRIDGE_VERSION=$bridge" >> "$GITHUB_ENV"
          echo "APP_VERSION=$tag" >> "$GITHUB_ENV"

      # Shipped as its own download so an operator whose FTP the panel
      # cannot reach still has a way to install the bridge by hand.
      - name: Collect the release assets
        run: |
          mkdir -p dist
          cp backend/resources/bridge/ZomboidControlBridge.lua dist/
          ( cd dist && sha256sum ZomboidControlBridge.lua > ZomboidControlBridge.lua.sha256 )

      - uses: softprops/action-gh-release@v2
        with:
          name: ZomboidControl ${{ env.APP_VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/ZomboidControlBridge.lua
            dist/ZomboidControlBridge.lua.sha256
          body: |
            ## Install

            ```bash
            docker compose pull && docker compose up -d
            ```

            Or pin this version with `APP_VERSION=${{ env.APP_VERSION }}` in
            your `.env`. Full instructions, including Coolify, are in the
            [README](https://github.com/${{ github.repository }}#readme).

            **Image:** `ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}`

            ## The Lua bridge (${{ env.BRIDGE_VERSION }})

            The panel uploads the bridge itself under *Servers → Bridge →
            Install*, which is the way to do it. `ZomboidControlBridge.lua`
            is attached below for the case where the panel cannot reach your
            FTP: drop it into your server's `media/lua/server/` directory and
            restart the game server.

            A bridge on disk is not yet a running bridge — the game loads it
            at start, and the panel's bridge page reports the version that is
            actually answering, not the file.
