services:
  app:
    image: ghcr.io/zone1987/zomboid-control-panel:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Generated on first start when left empty, and kept in the secrets
      # volume. Set them to migrate an existing installation.
      APP_SECRET: ${APP_SECRET:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      # Left empty on purpose: the entrypoint builds it from the password
      # the database generated. Set it to point at an external database.
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-zomboid}
      POSTGRES_USER: ${POSTGRES_USER:-zomboid}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      # Coolify sets COOLIFY_URL to the domain configured for the
      # application, so nothing has to be typed there. Elsewhere,
      # APP_PUBLIC_URL is the one value an operator supplies.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      COOLIFY_URL: ${COOLIFY_URL:-}
      # Derived from APP_PUBLIC_URL by the entrypoint unless set here.
      SERVER_NAME: ${SERVER_NAME:-}
      WEBAUTHN_RELYING_PARTY_ID: ${WEBAUTHN_RELYING_PARTY_ID:-}
      WEBAUTHN_RELYING_PARTY_NAME: ${WEBAUTHN_RELYING_PARTY_NAME:-ZomboidControl}
      MESSENGER_WORKERS: ${MESSENGER_WORKERS:-1}
      PHP_FPM_API_MAX_CHILDREN: ${PHP_FPM_API_MAX_CHILDREN:-12}
      PHP_FPM_SSE_MAX_CHILDREN: ${PHP_FPM_SSE_MAX_CHILDREN:-8}
    # No published port. A reverse proxy -- Coolify's included -- routes
    # to `expose` and never needs one, while publishing claims the port
    # on the host and fails the whole deployment when something already
    # holds it. To reach the panel directly instead, uncomment the
    # `ports` block below or use docker-compose.local.yaml.
    expose:
      - "80"
    # ports:
    #   - "${APP_PORT:-8080}:80"
    volumes:
      - secrets:/app/var/secrets

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zomboid}
      POSTGRES_USER: ${POSTGRES_USER:-zomboid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    # POSTGRES_PASSWORD wins when set; otherwise one is generated. Either
    # way it lands in the file the panel reads, so both sides agree.
    # Written before postgres starts, which reads the file immediately.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /run/secrets
        if [ -n "${POSTGRES_PASSWORD:-}" ]; then
          printf '%s' "$$POSTGRES_PASSWORD" > /run/secrets/database-password
        elif [ ! -s /run/secrets/database-password ]; then
          tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 48 > /run/secrets/database-password
        fi
        chmod 600 /run/secrets/database-password
        unset POSTGRES_PASSWORD
        exec docker-entrypoint.sh postgres
    volumes:
      - database:/var/lib/postgresql/data
      - secrets:/run/secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zomboid} -d ${POSTGRES_DB:-zomboid}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  database:
  secrets:
