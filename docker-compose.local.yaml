# Publishes the panel on a host port, for running it without a proxy.
#
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d
#
# Kept out of the base file because Coolify deploys that one as-is, and a
# published port there claims a port on the host and fails the deployment
# when something already holds it.
services:
  app:
    ports:
      - "${APP_PORT:-8080}:80"
