<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ZomboidControl">
  <title>ZomboidControl</title>

  <rect width="64" height="64" rx="14" fill="#11130e"/>

  <!-- A squared-off skull with a rounded jaw, drawn in the panel's own
       green rather than traced from the game's artwork. -->
  <path fill="#7cbf58" d="M13 21c0-5.5 4.5-10 10-10h18c5.5 0 10 4.5 10 10v14c0 9-6 16-14.5 18.5L32 54l-4.5-0.5C19 51 13 44 13 35V21z"/>

  <!-- A lighter plane down the left, so the face reads as lit from one
       side; shading would turn to mud at favicon size. -->
  <path fill="#93d46b" d="M13 21c0-5.5 4.5-10 10-10h9v42.5l-4.5-0.5C19 51 13 44 13 35V21z"/>

  <!-- Sunken eyes, the right smaller and higher: the asymmetry is what
       makes it read as a zombie rather than a frog. -->
  <ellipse cx="24" cy="29" rx="5.4" ry="6.4" fill="#11130e"/>
  <ellipse cx="41.5" cy="28" rx="4.2" ry="5.2" fill="#11130e"/>
  <circle cx="25.8" cy="27" r="1.7" fill="#e4f7d6"/>
  <circle cx="42.7" cy="26.4" r="1.3" fill="#e4f7d6"/>

  <!-- Stitched mouth, low on the jaw where a mouth belongs. -->
  <path stroke="#11130e" stroke-width="2.6" stroke-linecap="round" d="M22.5 43.5h19"/>
  <path stroke="#11130e" stroke-width="1.9" stroke-linecap="round" d="M27 39.8v7.4M32 39.8v7.4M37 39.8v7.4"/>
</svg>
