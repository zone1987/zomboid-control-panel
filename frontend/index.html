<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ZomboidControl</title>
    <script>
      // Applied before the app mounts, otherwise a light frame flashes
      // between first paint and React setting the class.
      (function () {
        try {
          var language = localStorage.getItem('zomboidcontrol.language')

          document.documentElement.lang =
            language === 'de' || language === 'en'
              ? language
              : navigator.language.indexOf('de') === 0
                ? 'de'
                : 'en'
        } catch (error) {
          document.documentElement.lang = 'en'
        }

        try {
          var stored = localStorage.getItem('zomboidcontrol.theme')
          var dark =
            stored === 'dark' ||
            (stored === null && true) ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
