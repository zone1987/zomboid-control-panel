# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The one place the panel's own version is declared.
    app.version: '1.4.0'

    # The image copies them here; a checkout has them in the frontend.
    app.locale_directory: '%env(default:app.default_locale_directory:APP_LOCALE_DIRECTORY)%'
    app.default_locale_directory: '%kernel.project_dir%/../frontend/src/i18n/locales'
    app.repository: '%env(default:app.default_repository:GITHUB_REPOSITORY)%'
    app.default_repository: 'zone1987/zomboid-control-panel'
    app.default_secrets_path: '%kernel.project_dir%/var/secrets'
    app.https_default: true

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\Encryption\CredentialCipher:
        arguments:
            $hexKey: '%env(CREDENTIALS_ENCRYPTION_KEY)%'

    App\Controller\Api\GeneratedSecretsEndpoint:
        arguments:
            $generatedSecretsPath: '%env(default:app.default_secrets_path:GENERATED_SECRETS_PATH)%'

    App\Panel\PanelUpdateChecker:
        arguments:
            $version: '%app.version%'
            $repository: '%app.repository%'

    App\EventSubscriber\SecurityHeadersSubscriber:
        arguments:
            $https: '%env(bool:default:app.https_default:PANEL_HTTPS)%'

    App\Security\Encryption\EncryptedTypeConfigurator:
        tags:
            - { name: doctrine.middleware }

    App\Settings\SettingsProvider:
        arguments:
            $envDefaults:
                'steam.api_key': '%env(STEAM_WEB_API_KEY)%'
                'google.client_id': '%env(OAUTH_GOOGLE_ID)%'
                'google.client_secret': '%env(OAUTH_GOOGLE_SECRET)%'
                'mailer.dsn': '%env(MAILER_DSN)%'
                'mailer.from_address': '%env(MAIL_FROM_ADDRESS)%'
                'mailer.from_name': '%env(MAIL_FROM_NAME)%'

    App\Security\OAuth\GoogleClientFactory:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    # Steam compares return_to on the way out against the way back, so
    # every call site has to build it the same way.
    App\Security\OAuth\SteamReturnUrl:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Invitation\InvitationService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Security\PasswordReset\PasswordResetService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Server\Items\Icons\ChunkedUpload:
        arguments:
            $temporaryDirectory: '%kernel.project_dir%/var/icons/incoming'

    App\Command\ExtractIconsCommand:
        arguments:
            $characterStore: '@character.icon_store'

    App\Controller\Api\CharacterSheetController:
        arguments:
            $characterStore: '@character.icon_store'
        tags: ['controller.service_arguments']

    App\Server\Items\Icons\IconStore:
        arguments:
            # Outside the document root and out of git: the pictures are
            # The Indie Stone's, extracted from the operator's own copy.
            $directory: '%kernel.project_dir%/var/icons'

    # The character sheet's own artwork, kept apart from five thousand
    # item icons so either can be re-extracted without the other.
    character.icon_store:
        class: App\Server\Items\Icons\IconStore
        arguments:
            $directory: '%kernel.project_dir%/var/character-icons'


    App\Settings\SupportedLanguages:
        arguments:
            # Derived from the interface's own translation files, so a new
            # language is one file rather than a list in two places.
            # The image carries a copy at resources/locales; the
            # frontend sources are only there in a checkout.
            $localeDirectory: '%app.locale_directory%'

    App\Server\Vehicles\Models\ModelStore:
        arguments:
            # Out of git and outside the document root: the models are
            # The Indie Stone's, from the operator's own installation.
            $directory: '%kernel.project_dir%/var/vehicle-models'

    App\Server\Vehicles\VehicleOverlay:
        arguments:
            $saved: '@App\Server\Vehicles\SavedVehicleStore'
            $bridge: '@App\Server\Vehicles\BridgeVehicleSource'

    App\Server\Vehicles\SavedVehicleStore:
        arguments:
            # The save database is fetched here, read and deleted again;
            # nothing of the server's own data is kept.
            $workingDirectory: '%kernel.project_dir%/var/vehicles'

    App\Server\Mods\CoverStore:
        arguments:
            # Out of git and outside the document root, like the icons:
            # these are other people's cover art, fetched from Steam and
            # kept only so the panel can serve them itself.
            $directory: '%kernel.project_dir%/var/mod-covers'

    App\Server\Bridge\BridgeInstaller:
        arguments:
            $bridgeSourcePath: '%kernel.project_dir%/resources/bridge/ZomboidControlBridge.lua'

when@test:
    services:
        # An expected 403 is logged as [error] by the framework logger,
        # which buries a real failure under hundreds of lines of noise in
        # the CI output. The tests assert the status code; the log adds
        # nothing.
        logger:
            class: Psr\Log\NullLogger

        # Public so a test can swap in a recording double; the console and
        # the moderation endpoints are otherwise untestable without a
        # server on the other end. The alias keeps autowiring intact.
        App\Server\Rcon\RconClientInterface:
            alias: App\Server\Rcon\SourceRconClient
            public: true

        # And again for the workshop: a test asserting the mod
        # endpoints' shape must not depend on Valve being reachable.
        App\Server\Mods\WorkshopSource:
            alias: App\Server\Mods\WorkshopClient
            public: true

        # Same reason: a functional test of the interaction endpoint has
        # to see what would have been sent to Discord, and there is no
        # Discord to send it to.
        App\Server\Discord\DiscordClientInterface:
            alias: App\Server\Discord\RestDiscordClient
            public: true
