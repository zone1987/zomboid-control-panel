# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\Encryption\CredentialCipher:
        arguments:
            $hexKey: '%env(CREDENTIALS_ENCRYPTION_KEY)%'

    App\Security\Encryption\EncryptedTypeConfigurator:
        tags:
            - { name: doctrine.middleware }

    App\Settings\SettingsProvider:
        arguments:
            $envDefaults:
                'steam.api_key': '%env(STEAM_WEB_API_KEY)%'
                'google.client_id': '%env(OAUTH_GOOGLE_ID)%'
                'google.client_secret': '%env(OAUTH_GOOGLE_SECRET)%'
                'mailer.dsn': '%env(MAILER_DSN)%'
                'mailer.from_address': '%env(MAIL_FROM_ADDRESS)%'
                'mailer.from_name': '%env(MAIL_FROM_NAME)%'

    App\Security\OAuth\GoogleClientFactory:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Invitation\InvitationService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Security\PasswordReset\PasswordResetService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Server\Items\Icons\IconStore:
        arguments:
            # Outside the document root and out of git: the pictures are
            # The Indie Stone's, extracted from the operator's own copy.
            $directory: '%kernel.project_dir%/var/icons'

    App\Server\Map\MapTileStore:
        arguments:
            # The game's own map pyramid, copied in by the operator. Out
            # of git for the same reason as the icons.
            $directory: '%kernel.project_dir%/var/map'

    App\Settings\SupportedLanguages:
        arguments:
            # Derived from the interface's own translation files, so a new
            # language is one file rather than a list in two places.
            $localeDirectory: '%kernel.project_dir%/../frontend/src/i18n/locales'

    App\Server\Bridge\BridgeInstaller:
        arguments:
            $bridgeSourcePath: '%kernel.project_dir%/resources/bridge/ZomboidControlBridge.lua'

when@test:
    services:
        # Public so a test can swap in a recording double; the console and
        # the moderation endpoints are otherwise untestable without a
        # server on the other end. The alias keeps autowiring intact.
        App\Server\Rcon\RconClientInterface:
            alias: App\Server\Rcon\SourceRconClient
            public: true
