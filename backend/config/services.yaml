# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\Encryption\CredentialCipher:
        arguments:
            $hexKey: '%env(CREDENTIALS_ENCRYPTION_KEY)%'

    App\Security\Encryption\EncryptedTypeConfigurator:
        tags:
            - { name: doctrine.middleware }

    App\Settings\SettingsProvider:
        arguments:
            $envDefaults:
                'steam.api_key': '%env(STEAM_WEB_API_KEY)%'
                'google.client_id': '%env(OAUTH_GOOGLE_ID)%'
                'google.client_secret': '%env(OAUTH_GOOGLE_SECRET)%'
                'mailer.dsn': '%env(MAILER_DSN)%'
                'mailer.from_address': '%env(MAIL_FROM_ADDRESS)%'
                'mailer.from_name': '%env(MAIL_FROM_NAME)%'

    App\Server\Map\CellFetcher:
        arguments:
            # Cells arrive from the game server on demand; the renderer
            # reads them from here as if they were a local installation.
            $directory: '%kernel.project_dir%/var/map-cells'

    App\Server\Map\RenderProgress:
        arguments:
            $path: '%kernel.project_dir%/var/map/render-progress.json'

    App\Server\Map\RenderRoot:
        arguments:
            $directory: '%kernel.project_dir%/var/pz-root'

    App\Server\Map\Textures\TexturePackStore:
        arguments:
            # Outside the image: a redeploy would otherwise take 400 MB
            # of uploaded packs with it.
            $directory: '%kernel.project_dir%/var/textures'

    App\Server\Map\Textures\ChunkedUpload:
        arguments:
            $temporaryDirectory: '%kernel.project_dir%/var/textures/incoming'

    App\Security\OAuth\GoogleClientFactory:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Invitation\InvitationService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Security\PasswordReset\PasswordResetService:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'

    App\Server\Items\Icons\IconStore:
        arguments:
            # Outside the document root and out of git: the pictures are
            # The Indie Stone's, extracted from the operator's own copy.
            $directory: '%kernel.project_dir%/var/icons'


    App\Server\Map\IsometricTiles:
        arguments:
            # Where the renderer puts its tiles. The path is fixed by
            # pzmap2dzi, which appends html/map_data/base to whatever
            # output root it is given.
            $directory: '%kernel.project_dir%/var/map/iso/html/map_data/base'

    App\Server\Map\TileRenderer:
        arguments:
            # Both come from the image, which ships pzmap2dzi and its
            # own Python. Left overridable so a developer can point at a
            # checkout instead.
            $rendererPath: '%env(PZMAP_RENDERER_PATH)%'
            $python: '%env(PZMAP_PYTHON)%'
            $projectDirectory: '%kernel.project_dir%'

    App\Settings\SupportedLanguages:
        arguments:
            # Derived from the interface's own translation files, so a new
            # language is one file rather than a list in two places.
            $localeDirectory: '%kernel.project_dir%/../frontend/src/i18n/locales'

    App\Server\Bridge\BridgeInstaller:
        arguments:
            $bridgeSourcePath: '%kernel.project_dir%/resources/bridge/ZomboidControlBridge.lua'

when@test:
    services:
        # Public so a test can swap in a recording double; the console and
        # the moderation endpoints are otherwise untestable without a
        # server on the other end. The alias keeps autowiring intact.
        App\Server\Rcon\RconClientInterface:
            alias: App\Server\Rcon\SourceRconClient
            public: true
