framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine rather than a broker: one less service for someone
            # self-hosting this to run and understand.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # A slow SMTP server would otherwise hold up the request that
            # triggered the mail.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            # Hours of work; it must not hold a request open.
            App\Message\RenderWorld: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
