security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_users
            # Two-factor authentication needs the session to hold the
            # half-authenticated state, so this firewall stays stateful.
            stateless: false

            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\Http\LoginSuccessHandler
                failure_handler: App\Security\Http\LoginFailureHandler

            two_factor:
                auth_form_path: 2fa_login
                check_path: api_2fa_check
                # PropertyAccess syntax: {"code": "123456"}
                auth_code_parameter_name: code
                prepare_on_login: true
                prepare_on_access_denied: true
                success_handler: App\Security\Http\TwoFactorSuccessHandler
                failure_handler: App\Security\Http\TwoFactorFailureHandler
                authentication_required_handler: App\Security\Http\TwoFactorRequiredHandler

            entry_point: App\Security\Http\ApiEntryPoint

            logout:
                path: api_logout
                target: /

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/setup, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/session$, roles: PUBLIC_ACCESS }
        - { path: ^/api/password-reset, roles: PUBLIC_ACCESS }
        - { path: ^/api/invitations/accept, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/api/users, roles: ROLE_ADMIN }
        - { path: ^/api/servers, roles: ROLE_SERVER_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
